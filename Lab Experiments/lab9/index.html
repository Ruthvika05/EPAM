<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JS DOM Events</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Task 1: Button Click Alert -->
  <!-- ========================= -->
  <div id="task1">
    <h2>Task 1: Button Click Alert</h2>
    <button id="alertButton">Click Me!</button>
  </div>

  <!-- Task 2: Input Field Live Preview -->
  <!-- ================================ -->
  <div id="task2">
    <h2>Task 2: Input Live Preview</h2>
    <input type="text" id="liveInput" placeholder="Type something...">
    <p id="livePreview">Preview will appear here.</p>
  </div>

  <!-- Task 3: Mouseover Color Change -->
  <!-- ============================== -->
  <div id="task3">
    <h2>Task 3: Mouseover Color Change</h2>
    <div id="colorBox">Hover over me!</div>
  </div>

  <!-- Task 4: Keydown Counter -->
  <!-- ======================== -->
  <div id="task4">
    <h2>Task 4: Keydown Counter</h2>
    <input type="text" id="keyInput" placeholder="Start typing...">
    <p>Keys pressed: <span id="keyCount">0</span></p>
  </div>

  <script src="index.js"></script>
</body>
</html>
